<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Zumba Workout - Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a2e;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .offline-container { max-width: 400px; }
    .offline-emoji { font-size: 5rem; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: #8892a4; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #ff2d78, #ff6b35);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-emoji">📡</div>
    <h1>Sei Offline!</h1>
    <p>Sembra che tu non sia connesso a Internet. Controlla la tua connessione e riprova.</p>
    <button class="btn" onclick="location.reload()">🔄 Riprova</button>
  </div>
</body>
</html>
